<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!--A:HEAD-->
<title>호랑이 길드 운영실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: phone-first single column app shell — sticky header, card stack, fixed bottom tab bar */
:root{
  --bg:#f6f1e8;
  --surface:#fffdf8;
  --surface2:#f1e9da;
  --text:#2c2418;
  --text2:#8b7f6c;
  --line:#e7ddca;
  --brand:#df661d;
  --brand-deep:#b04a0e;
  --brand-soft:#fbe8d6;
  --on-brand:#ffffff;
  --ok:#1f8a5f;
  --ok-soft:#e1f2e9;
  --bad:#cf4536;
  --bad-soft:#fbe6e2;
  --warn:#b97a10;
  --warn-soft:#faeed3;
  --hero1:#ff9a43;
  --hero2:#e0661c;
  --hero3:#9c3c06;
  --nav-bg:rgba(255,253,248,.95);
  --shadow:0 10px 26px rgba(60,42,20,.09);
  --font-disp:"Jua","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --font-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191410;
    --surface:#221c14;
    --surface2:#2d251a;
    --text:#f3ebdd;
    --text2:#a29683;
    --line:#3a3122;
    --brand:#f58434;
    --brand-deep:#ffb277;
    --brand-soft:#3b2a17;
    --on-brand:#241303;
    --ok:#4cc08d;
    --ok-soft:#1c3a2c;
    --bad:#f57e6e;
    --bad-soft:#452622;
    --warn:#e2a844;
    --warn-soft:#3e3118;
    --nav-bg:rgba(30,24,17,.95);
    --shadow:0 10px 26px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191410;
  --surface:#221c14;
  --surface2:#2d251a;
  --text:#f3ebdd;
  --text2:#a29683;
  --line:#3a3122;
  --brand:#f58434;
  --brand-deep:#ffb277;
  --brand-soft:#3b2a17;
  --on-brand:#241303;
  --ok:#4cc08d;
  --ok-soft:#1c3a2c;
  --bad:#f57e6e;
  --bad-soft:#452622;
  --warn:#e2a844;
  --warn-soft:#3e3118;
  --nav-bg:rgba(30,24,17,.95);
  --shadow:0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
img{max-width:100%}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.wrap{max-width:620px;margin:0 auto;padding:0 16px 132px}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--nav-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:620px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.hdr .logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--hero1),var(--hero3));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:var(--shadow)}
.hdr .tt{min-width:0;flex:1}
.hdr h1{margin:0;font-family:var(--font-disp);font-weight:400;font-size:19px;letter-spacing:.2px;line-height:1.2}
.hdr .sub{font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub b{color:var(--bad);font-weight:600}
.weekchip{flex-shrink:0;background:var(--brand-soft);color:var(--brand-deep);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:999px}

/* ---------- demo banner ---------- */
.demobar{background:var(--warn-soft);color:var(--warn);font-size:12.5px;padding:8px 16px;text-align:center;border-bottom:1px solid var(--line)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:800}
.card .desc{font-size:12.5px;color:var(--text2);margin:0 0 10px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;margin-top:14px;padding:22px 20px 18px;color:#fff;background:linear-gradient(140deg,var(--hero1),var(--hero2) 55%,var(--hero3));box-shadow:var(--shadow)}
.hero .mascot{position:absolute;right:6px;top:10px;font-size:84px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));transform:rotate(6deg)}
.hero .greet{font-size:13px;opacity:.92}
.hero .yr{font-family:var(--font-disp);font-size:17px;opacity:.95;margin-top:10px}
.hero .big{font-family:var(--font-disp);font-size:42px;line-height:1.05;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.18)}
.hero .quip{font-size:13px;margin-top:6px;opacity:.95}
.hero .dates{display:flex;gap:8px;margin-top:16px}
.hero .dcell{flex:1;background:rgba(20,8,0,.28);border-radius:14px;padding:9px 6px;text-align:center;backdrop-filter:blur(2px)}
.hero .dcell .l{font-size:11.5px;opacity:.85}
.hero .dcell .v{font-weight:800;font-size:14px;margin-top:2px}

/* ---------- call banner & notice ---------- */
.callbar{margin-top:14px;background:var(--brand-soft);border:1px solid var(--brand);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--brand-deep);display:flex;gap:8px;align-items:flex-start}
.notice{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.notice summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.notice summary::-webkit-details-marker{display:none}
.notice summary .arr{margin-left:auto;color:var(--text2);transition:transform .2s}
.notice[open] summary .arr{transform:rotate(90deg)}
.notice .nbody{padding:0 14px 12px;font-size:13.5px;color:var(--text);white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:10px}

/* ---------- chips / filters ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--text2)}
.chip .n{font-weight:800;margin-left:3px}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip.ok-on{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.bad-on{background:var(--bad);border-color:var(--bad);color:#fff}
.selwrap{margin-left:auto}
select.sel{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 28px 7px 14px;font-size:13px;font-weight:600;color:var(--text2);background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}

/* ---------- contribution table ---------- */
.tblwrap{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11.5px;color:var(--text2);font-weight:600;text-align:left;padding:10px 7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 7px;font-size:13.5px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:none}
td.nick{font-weight:700;position:relative;padding-left:13px;max-width:112px;overflow:hidden;text-overflow:ellipsis}
td.nick::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0}
tr.done td.nick::before{background:var(--ok)}
tr.miss td.nick::before{background:var(--bad)}
.lvb{display:inline-block;background:var(--surface2);color:var(--text2);border-radius:8px;padding:2px 7px;font-size:11.5px;font-weight:700}
.acc{color:var(--text2);font-size:12.5px}
.acc b{color:var(--text);font-size:13.5px}
td.diff{font-weight:800}
tr.done td.diff{color:var(--ok)}
tr.miss td.diff{color:var(--bad)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
.warnb{display:inline-block;background:var(--warn-soft);color:var(--warn);font-weight:800;font-size:12px;border-radius:8px;padding:2px 8px}
.thr{font-size:12px;color:var(--text2);margin-top:10px;text-align:center}

/* ---------- weekly chart & matrix ---------- */
.chart text{fill:var(--text2);font-size:11px;font-family:var(--font-body)}
.chart .val{fill:var(--text);font-weight:700;font-size:11.5px}
.chart .bar{fill:var(--brand)}
.chart .axis{stroke:var(--line)}
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.cellv{display:inline-block;min-width:52px;border-radius:9px;padding:3px 8px;font-size:12.5px;font-weight:700}
.cellv.ok{background:var(--ok-soft);color:var(--ok)}
.cellv.bad{background:var(--bad-soft);color:var(--bad)}
.cellv.na{color:var(--text2);font-weight:500}

/* ---------- member cards ---------- */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px;width:100%;text-align:left;display:block;transition:transform .12s}
.mcard:active{transform:scale(.985)}
.mcard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mcard .nm{font-weight:800;font-size:15.5px}
.roleb{font-size:11px;font-weight:800;border-radius:8px;padding:2.5px 8px}
.roleb.r0{background:var(--brand);color:var(--on-brand)}
.roleb.r1{background:var(--brand-soft);color:var(--brand-deep)}
.roleb.r2{background:var(--surface2);color:var(--text2)}
.mcard .meta{font-size:12.5px;color:var(--text2);margin-top:3px}
.mcard .empty{color:var(--text2);font-size:13px;margin-top:8px;text-align:center;padding:10px 0;border:1.5px dashed var(--line);border-radius:12px}
.kv{display:flex;justify-content:space-between;gap:10px;background:var(--surface2);border-radius:12px;padding:9px 12px;margin-top:8px;font-size:13.5px}
.kv .k{color:var(--text2)}
.kv .v{font-weight:800}
.dealers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.dealer{background:var(--surface2);border-radius:12px;padding:8px 6px;text-align:center}
.dealer .dn{font-weight:800;font-size:12.5px}
.dealer .dl{font-size:11px;color:var(--text2);margin-top:2px}
.mcard .upd{font-size:11px;color:var(--text2);text-align:right;margin-top:10px}

/* ---------- share (videos & tips) ---------- */
.subtabs{display:flex;background:var(--surface2);border-radius:14px;padding:4px;margin-top:14px}
.subtabs button{flex:1;border-radius:11px;padding:9px 0;font-weight:700;font-size:13.5px;color:var(--text2)}
.subtabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.addbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:14px;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:14.5px;border-radius:16px;padding:14px 0;box-shadow:var(--shadow)}
.hint{font-size:12px;color:var(--text2);margin-top:8px;text-align:center}
.vthumb{position:relative;display:block;margin-top:10px;border-radius:14px;overflow:hidden;background:var(--surface2);aspect-ratio:16/9;max-width:100%}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;background:rgba(0,0,0,.25);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.vthumb iframe{width:100%;height:100%;border:0;display:block}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
.pcard .pt{font-weight:800;font-size:14.5px}
.pcard .pm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--text2)}
.modeb{background:var(--brand-soft);color:var(--brand-deep);font-weight:700;border-radius:8px;padding:2px 8px;font-size:11.5px}
.pcard .pb{font-size:13.5px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.pcard .pb.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pacts{display:flex;gap:6px;margin-left:auto}
.iconb{width:32px;height:32px;border-radius:10px;background:var(--surface2);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:14px}
.linkout{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--surface2);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;color:var(--brand-deep)}

/* ---------- comments ---------- */
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
.ccard .ct{font-size:14px;white-space:pre-wrap;word-break:break-word}
.ccard .cm{display:flex;align-items:center;margin-top:10px;font-size:12px;color:var(--text2)}

/* ---------- empty state ---------- */
.emptybox{text-align:center;padding:36px 16px;color:var(--text2);font-size:13.5px}
.emptybox .big{font-size:40px;margin-bottom:8px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--nav-bg);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:620px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;font-size:10.5px;font-weight:700;color:var(--text2)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--brand)}

/* ---------- FABs ---------- */
.fabs{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-call{width:58px;height:58px;border-radius:50%;background:linear-gradient(140deg,var(--hero1),var(--hero3));color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(160,70,10,.45)}
.fab-gear{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text2);font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;z-index:100;background:rgba(25,15,5,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:560px){.ovl{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:88dvh;display:flex;flex-direction:column;animation:up .22s ease}
@media (min-width:560px){.sheet{border-radius:22px;max-height:86dvh}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .shd{display:flex;align-items:center;gap:8px;padding:16px 18px 10px}
.sheet .shd h3{margin:0;font-size:16.5px;font-weight:800;flex:1}
.sheet .x{width:32px;height:32px;border-radius:50%;background:var(--surface2);color:var(--text2);font-size:15px;display:flex;align-items:center;justify-content:center}
.sheet .sbody{padding:2px 18px 18px;overflow-y:auto}
.frow{margin-top:12px}
.frow label{display:block;font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:6px}
.inp,textarea.inp{width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:13px;padding:11px 13px;font-size:14.5px}
.inp:focus{outline:none;border-color:var(--brand);background:var(--surface)}
textarea.inp{resize:vertical;min-height:90px}
.btn{display:block;width:100%;text-align:center;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:15px;border-radius:14px;padding:13px 0;margin-top:16px}
.btn.sub{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}
.mnote{font-size:12px;color:var(--text2);margin-top:10px;line-height:1.5}
.preset{display:flex;flex-wrap:wrap;gap:8px}
.preset button{background:var(--surface2);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}
.preset button.on{background:var(--brand);color:var(--on-brand)}
.drow{display:grid;grid-template-columns:1.4fr 1fr 1fr 34px;gap:6px;margin-top:6px;align-items:center}
.drow .del{color:var(--bad);font-size:16px;text-align:center}
.arow{display:grid;grid-template-columns:1.5fr 1fr .9fr 56px;gap:6px;margin-top:6px;align-items:center}
.wrow{display:grid;grid-template-columns:1.2fr 1fr 1fr .7fr;gap:6px;margin-top:6px;align-items:center;font-size:13px}
.wrow .wn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admsec{border-top:1px dashed var(--line);margin-top:18px;padding-top:14px}
.admsec h4{margin:0 0 4px;font-size:14px}
.admsec .small{font-size:12px;color:var(--text2);margin:0 0 6px}
.wklist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.wkitem{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:9px 12px;font-size:13.5px}
.wkitem b{flex:1}
.smallbtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--text2)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:200;background:var(--text);color:var(--bg);font-size:13.5px;font-weight:600;border-radius:999px;padding:10px 18px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.secthead{margin:22px 0 0;font-size:13px;font-weight:800;color:var(--text2);letter-spacing:.4px}
</style>
<!--/A:HEAD-->
</head>
<body>
<script src="firebase-config.js"></script>
<!--A:BODY-->
<header class="hdr">
  <div class="hdr-in">
    <div class="logo">🐯</div>
    <div class="tt">
      <h1 id="siteTitle">호랑이 길드 운영실</h1>
      <div class="sub">협동타워디펜스 · 오늘도 으르렁대며 굴러가는 호랑이 길드 <b>🧡</b></div>
    </div>
    <div class="weekchip" id="hdrWeek">—</div>
  </div>
</header>
<div class="demobar" id="demobar" hidden></div>

<main class="wrap">
  <div id="view"></div>
</main>

<div class="fabs">
  <button class="fab-gear" id="fabGear" aria-label="관리자 메뉴">⚙️</button>
  <button class="fab-call" id="fabCall" aria-label="길드원 호출하기">🐯</button>
</div>

<nav class="nav" aria-label="메뉴">
  <div class="nav-in" id="navBar">
    <button data-tab="contrib" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>
      기여도 확인
    </button>
    <button data-tab="weekly">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      주차별 기여도
    </button>
    <button data-tab="members">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2.2"/><path d="M6 16.5c.7-1.6 5.3-1.6 6 0M15 9.5h4M15 13h4"/></svg>
      유저정보
    </button>
    <button data-tab="share">

'use strict';
/* ================= 설정 ================= */

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseInt(String(v == null ? '' : v).replace(/[^\d-]/g, ''), 10); return isNaN(n) ? 0 : n; };
const DOW = '일월화수목금토';
function fmtDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일(' + DOW[d.getDay()] + ')';
}
function fmtTs(ms) {
  if (!ms) return '';
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function shortWeek(label) {
  const m = /(\d+)월\s*(\d+)\s*주차/.exec(label || '');
  return m ? m[1] + '/' + m[2] + '주' : String(label || '').slice(0, 6);
}
function ytId(url) {
  const m = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{6,})/.exec(url || '');
  return m ? m[1] : null;
}
function loadScript(src) {
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => no(new Error('load fail: ' + src));
    document.head.appendChild(s);
  });
}
let toastTimer = null;
function toast(msg) {

}
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function markMine(kind, id) { (mine[kind] = mine[kind] || []).push(id); lsSet(MINE_KEY, mine); }

      '어흥대장': R(1840, 2470), '꼬랑지': R(1710, 0), '줄무늬': R(1500, 2150), '앞발펀치': R(1640, 0),
      '호피': R(1150, 0, 1), '냥젤리': R(1390, 2000), '숲의왕': R(1310, 0), '아기호랑': R(930, 0, 1) } }

  return {

    } },
    members, weeks,

    videos: {},
    tips: { t1: {
      title: '주간 기여도, 일퀘만 해도 충분해요', cat: '공략',
      body: '매일 일일 퀘스트 3개만 꼬박꼬박 돌리면 주간 +600은 무리 없이 채워져요.\n주말에 몰아서 하면 놓치기 쉬우니까 저녁 알람 추천! 협동 모드는 보상 2배 요일에 돌리면 더 빨라요.',
      nick: '어흥대장', ts: now - 86400000 * 4 } },
    calls: {}
  };
}

/* ================= 데이터 계층 (로컬 데모 ↔ Firebase) ================= */
const COLS = ['meta', 'members', 'weeks', 'comments', 'videos', 'tips', 'calls'];
const DB = {
  data: {}, subs: [], fs: null, ready: false,
  LS_KEY: 'tg-db-v1',
  emit() { this.subs.forEach(f => { try { f(); } catch (e) { console.error(e); } }); },
  subscribe(f) { this.subs.push(f); },
  persist() { if (!LIVE) lsSet(this.LS_KEY, this.data); },
  async init() {
    COLS.forEach(c => this.data[c] = {});
    if (LIVE) {
      try {
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
        firebase.initializeApp(CFG.firebase);
        this.fs = firebase.firestore();
        COLS.forEach(c => this.fs.collection(c).onSnapshot(
          snap => { const m = {}; snap.forEach(d => m[d.id] = d.data()); this.data[c] = m; this.ready = true; this.emit(); },
          err => { console.error(err); toast('데이터 연결 오류: ' + err.code); }
        ));
      } catch (e) { console.error(e); toast('Firebase 연결에 실패했어요. firebase-config.js를 확인해주세요.'); }
    } else {
      const saved = lsGet(this.LS_KEY, null);
      this.data = saved && saved.members ? Object.assign(this.data, saved) : demoData();
      COLS.forEach(c => this.data[c] = this.data[c] || {});
      this.ready = true; this.persist(); this.emit();
    }
  },
  async set(col, id, obj) {
    if (LIVE) { try { await this.fs.collection(col).doc(id).set(obj); } catch (e) { console.error(e); toast('저장에 실패했어요 😿'); throw e; } }
    else { this.data[col][id] = obj; this.persist(); this.emit(); }
  },
  async del(col, id) {
    if (LIVE) { try { await this.fs.collection(col).doc(id).delete(); } catch (e) { console.error(e); toast('삭제에 실패했어요 😿'); throw e; } }
    else { delete this.data[col][id]; this.persist(); this.emit(); }
  },
  get(col, id) { return this.data[col] ? this.data[col][id] : null; },
  list(col) { return Object.entries(this.data[col] || {}).map(([id, v]) => Object.assign({ _id: id }, v)); }
};

/* ================= 파생 데이터 ================= */
const site = () => DB.get('meta', 'site') || { notice: '', threshold: 600, callTargets: '' };
const ROLE_ORDER = { '길마': 0, '부길마': 1, '길드원': 2 };
const roster = () => DB.list('members').sort((a, b) =>
  (ROLE_ORDER[a.role] ?? 9) - (ROLE_ORDER[b.role] ?? 9) || String(a.nick).localeCompare(String(b.nick), 'ko'));
const weekList = () => DB.list('weeks').sort((a, b) => String(a.base).localeCompare(String(b.base)));
const curWeek = () => { const w = weekList(); return w.length ? w[w.length - 1] : null; };
function rowOf(week, nick) {
  const r = (week && week.rows && week.rows[nick]) || { b: 0, c: 0, w: 0 };
  return { b: num(r.b), c: num(r.c), w: num(r.w), diff: num(r.c) - num(r.b) };
}

/* ================= 상태 ================= */
const S = {
  tab: 'contrib', filter: 'all', sort: 'nick',
  shareTab: 'videos', modeFilter: '전체',
  admin: (() => { try { return sessionStorage.getItem('tg-admin') === '1'; } catch (e) { return false; } })()
};
function setAdmin(v) { S.admin = v; try { v ? sessionStorage.setItem('tg-admin', '1') : sessionStorage.removeItem('tg-admin'); } catch (e) {} }

/* ================= 렌더링 ================= */
function render() {
  const wk = curWeek();
  $('#hdrWeek').textContent = wk ? wk.label : '준비 중';
  const bar = $('#demobar');
  if (!LIVE) {
    bar.hidden = false;
    bar.textContent = PREVIEW
      ? '🔍 미리보기 데모 — 데이터는 예시이고, 수정해도 이 기기에만 저장돼요'
      : '🧪 데모 모드 — Firebase 연결(가이드 2단계) 전까지는 수정이 이 기기에만 저장돼요';
  } else bar.hidden = true;
  $$('#navBar button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const v = $('#view');
  if (S.tab === 'contrib') v.innerHTML = viewContrib();
  else if (S.tab === 'weekly') v.innerHTML = viewWeekly();
  else if (S.tab === 'members') v.innerHTML = viewMembers();
  else if (S.tab === 'share') v.innerHTML = viewShare();
  else v.innerHTML = viewBoard();
}

/* ---------- 탭 1 : 기여도 확인 ---------- */
function viewContrib() {
  const wk = curWeek(), st = site(), thr = num(st.threshold);
  const year = wk && wk.base ? String(wk.base).slice(0, 4) : new Date().getFullYear();
  let h = `
  <section class="hero">
    <div class="mascot" aria-hidden="true">🐯</div>
    <div class="greet">점검 호랑이가 어슬렁 왔습니다</div>
    <div class="yr">${esc(year)}년</div>
    <div class="big">${wk ? esc(wk.label) : '첫 주차를 만들어주세요'}</div>
    <div class="quip">오늘 일퀘 다 하셨죠? 어흥!</div>
    <div class="dates">
      <div class="dcell"><div class="l">누적기여도 기록</div><div class="v">${wk ? fmtDate(wk.base) : '-'}</div></div>
      <div class="dcell"><div class="l">기여도 확인</div><div class="v">${wk ? fmtDate(wk.check) : '-'}</div></div>
    </div>
  </section>`;
  const calls = DB.list('calls').sort((a, b) => b.ts - a.ts);
  if (calls.length && Date.now() - calls[0].ts < 86400000 * 3)
    h += `<div class="callbar"><span>📣</span><div><b>${esc(calls[0].msg)}</b><br><span style="opacity:.75;font-size:11.5px">${fmtTs(calls[0].ts)} 호출</span></div></div>`;
  if (st.notice) h += `
  <details class="notice"><summary>📌 길드 공지사항 보기 <span class="arr">›</span></summary>
    <div class="nbody">${esc(st.notice)}</div></details>`;
  if (!wk) return h + onboardCard();

  const rows = roster().map(m => { const r = rowOf(wk, m.nick); return Object.assign({ m }, r, { done: r.diff >= thr }); });
  const doneN = rows.filter(r => r.done).length;
  const list = rows.filter(r => S.filter === 'all' ? true : S.filter === 'done' ? r.done : !r.done);
  if (S.sort === 'diff') list.sort((a, b) => b.diff - a.diff);
  else if (S.sort === 'lv') list.sort((a, b) => num(b.m.lv) - num(a.m.lv));

  h += `
  <div class="chips">
    <button class="chip ${S.filter === 'all' ? 'on' : ''}" data-act="filter" data-v="all">전체<span class="n">${rows.length}</span></button>
    <button class="chip ${S.filter === 'done' ? 'ok-on' : ''}" data-act="filter" data-v="done">완료<span class="n">${doneN}</span></button>
    <button class="chip ${S.filter === 'miss' ? 'bad-on' : ''}" data-act="filter" data-v="miss">미달<span class="n">${rows.length - doneN}</span></button>
    <span class="selwrap"><label class="sr" for="sortSel">정렬</label>
    <select class="sel" id="sortSel" data-act="sort">
      <option value="nick" ${S.sort === 'nick' ? 'selected' : ''}>닉네임순</option>
      <option value="diff" ${S.sort === 'diff' ? 'selected' : ''}>증가량순</option>
      <option value="lv" ${S.sort === 'lv' ? 'selected' : ''}>Lv순</option>
    </select></span>
  </div>
  <div class="tblwrap"><div class="tscroll"><table>
    <thead><tr><th>닉네임</th><th>Lv</th><th>누적 → 확인</th><th>증가량</th><th>상태</th><th>경고</th></tr></thead>
    <tbody>`;
  if (!list.length) h += `<tr><td colspan="6" style="text-align:center;color:var(--text2)">해당하는 길드원이 없어요</td></tr>`;
  list.forEach(r => {
    h += `<tr class="${r.done ? 'done' : 'miss'}">
      <td class="nick">${esc(r.m.nick)}</td>
      <td><span class="lvb">Lv.${esc(r.m.lv)}</span></td>
      <td class="acc">${r.b.toLocaleString()} → <b>${r.c.toLocaleString()}</b></td>
      <td class="diff">${r.diff >= 0 ? '+' : ''}${r.diff.toLocaleString()}</td>
      <td><span class="dot ${r.done ? 'ok' : 'bad'}"></span><span class="sr">${r.done ? '완료' : '미달'}</span></td>
      <td>${r.w > 0 ? `<span class="warnb">${r.w}</span>` : '<span style="color:var(--text2)">-</span>'}</td>
    </tr>`;
  });
  h += `</tbody></table></div></div>
  <p class="thr">주간 기준 <b>+${thr.toLocaleString()}</b> 이상이면 완료예요 · ${esc(wk.label)} 기준</p>`;
  return h;
}
function onboardCard() {
  return `<div class="card" style="text-align:center">
    <div style="font-size:38px">🏗️</div>
    <h2 style="margin-top:6px">아직 준비 중이에요</h2>
    <p class="desc">오른쪽 아래 ⚙️ 관리자 메뉴에서<br>길드원 명단과 첫 주차를 추가하면 시작돼요!</p></div>`;
}

/* ---------- 탭 2 : 주차별 기여도 ---------- */
function viewWeekly() {
  const wks = weekList().slice(-8), thr = num(site().threshold), ros = roster();
  if (!wks.length) return onboardCard();
  const totals = wks.map(w => {
    let sum = 0, done = 0;
    ros.forEach(m => { const d = rowOf(w, m.nick).diff; if (d > 0) sum += d; if (d >= thr) done++; });
    return { w, sum, done };
  });
  const max = Math.max(1, ...totals.map(t => t.sum));
  const BW = 34, GAP = 30, PAD = 18, H = 190, TOP = 26, BOT = 40;
  const W = PAD * 2 + totals.length * (BW + GAP) - GAP;
  let bars = '';
  totals.forEach((t, i) => {
    const x = PAD + i * (BW + GAP);
    const bh = Math.max(2, (t.sum / max) * (H - TOP - BOT));
    const y = H - BOT - bh, r = 4;
    bars += `<g><title>${esc(t.w.label)} · 합계 +${t.sum.toLocaleString()} · 완료 ${t.done}/${ros.length}</title>
      <path class="bar" d="M${x} ${H - BOT} L${x} ${y + r} Q${x} ${y} ${x + r} ${y} L${x + BW - r} ${y} Q${x + BW} ${y} ${x + BW} ${y + r} L${x + BW} ${H - BOT} Z"/>
      <text class="val" x="${x + BW / 2}" y="${y - 7}" text-anchor="middle">+${t.sum >= 1000 ? (t.sum / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : t.sum}</text>
      <text x="${x + BW / 2}" y="${H - BOT + 16}" text-anchor="middle">${esc(shortWeek(t.w.label))}</text>
      <text x="${x + BW / 2}" y="${H - BOT + 30}" text-anchor="middle" style="font-size:10px">완료 ${t.done}명</text></g>`;
  });
  let h = `<div class="card">
    <h2>주차별 길드 합계 📈</h2><p class="desc">주차마다 길드 전체가 올린 기여도 합계예요</p>
    <div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="주차별 길드 기여도 합계 막대그래프">
      <line class="axis" x1="${PAD - 6}" y1="${H - BOT}" x2="${W - PAD + 6}" y2="${H - BOT}"/>${bars}</svg></div></div>`;

  h += `<div class="card"><h2>길드원별 기록 🗂️</h2><p class="desc">주간 기준 +${thr.toLocaleString()} 이상이면 초록색!</p>
  <div style="overflow-x:auto"><table class="mx"><thead><tr><th>닉네임</th>`;
  wks.forEach(w => h += `<th>${esc(shortWeek(w.label))}</th>`);
  h += `</tr></thead><tbody>`;
  ros.forEach(m => {
    h += `<tr><td class="nick" style="padding-left:10px">${esc(m.nick)}</td>`;
    wks.forEach(w => {
      const has = w.rows && w.rows[m.nick];
      if (!has) { h += `<td><span class="cellv na">-</span></td>`; return; }
      const d = rowOf(w, m.nick).diff;
      h += `<td><span class="cellv ${d >= thr ? 'ok' : 'bad'}">${d >= 0 ? '+' : ''}${d.toLocaleString()}</span></td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div></div>`;
  return h;
}

function closeModal(el) { const o = el ? el.closest('.ovl') : $('#modalRoot .ovl:last-child'); if (o) o.remove(); }
function openModal(title, bodyHtml) {
  const o = document.createElement('div');
  o.className = 'ovl';
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="shd"><h3>${esc(title)}</h3><button class="x" data-close aria-label="닫기">✕</button></div>
    <div class="sbody">${bodyHtml}</div></div>`;
  o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-close]')) closeModal(e.target); });
  $('#modalRoot').appendChild(o);
  return o;
}
function confirmBox(msg, onYes) {

}

function kakaoReady() { return !PREVIEW && CFG.kakaoJsKey && window.Kakao && window.Kakao.isInitialized(); }
async function initKakao() {
  if (PREVIEW || !CFG.kakaoJsKey) return;
  try {
    await loadScript('https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js');
    if (!window.Kakao.isInitialized()) window.Kakao.init(CFG.kakaoJsKey);
  } catch (e) { console.error('Kakao SDK 로드 실패', e); }
}
function copyText(t, okMsg) {
  const done = () => toast(okMsg || '복사했어요!');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('복사가 안 되네요 😿'); }
  ta.remove();
}

      <h4>📌 공지 · 기준 설정</h4>
      <div class="frow"><label for="sNotice">길드 공지사항</label><textarea class="inp" id="sNotice">${esc(st.notice || '')}</textarea></div>
      <div class="frow"><label for="sThr">주간 완료 기준 (증가량)</label><input class="inp" id="sThr" inputmode="numeric" value="${esc(st.threshold ?? 600)}"></div>
      <div class="frow"><label for="sTargets">호출 대상 (쉼표로 구분)</label><input class="inp" id="sTargets" value="${esc(st.callTargets || '')}" placeholder="예: 어흥대장, 꼬랑지"></div>
      <button class="btn" id="sSave" style="margin-top:12px">설정 저장</button>
    </div>
    <div class="admsec"><h4>🐯 멤버 관리</h4><p class="small">역할·Lv 수정 후 아래 저장 버튼을 눌러주세요</p>
      <div id="memRows"></div>
      <div class="arow" style="margin-top:10px">
        <input class="inp" id="newNick" placeholder="새 닉네임">
        <select class="inp" id="newRole"><option>길드원</option><option>부길마</option><option>길마</option></select>
        <input class="inp" id="newLv" placeholder="Lv" inputmode="numeric">
        <button class="smallbtn" id="memAdd" style="color:var(--brand);border-color:var(--brand)">추가</button>
      </div>
      <div class="frow"><label for="bulkAdd">여러 명 한꺼번에 (한 줄에 "닉네임, Lv")</label>
        <textarea class="inp" id="bulkAdd" style="min-height:64px" placeholder="호랑나비, 21&#10;줄무늬양말, 19"></textarea></div>
      <div class="btnrow"><button class="btn sub" id="bulkGo">일괄 추가</button><button class="btn" id="memSave">멤버 저장</button></div>
    </div>
    <div class="admsec"><h4>📅 주차 관리</h4>
      <div class="wklist" id="wkList"></div>
      <div class="frow"><label for="nwBase">새 주차 시작일 (월요일)</label><input class="inp" id="nwBase" type="date"></div>
      <div class="frow"><label for="nwLabel">주차 이름</label><input class="inp" id="nwLabel" placeholder="예: 10월 2주차"></div>
      <button class="btn" id="nwGo">＋ 새 주차 만들기 (누적은 지난주 확인값으로 자동 입력)</button>
    </div>
    <div class="admsec"><h4>🔧 기타</h4>
      <div class="btnrow">
        <button class="btn sub" id="adLock">관리자 잠금</button>
        ${!LIVE ? '<button class="btn danger" id="demoReset">데모 데이터 초기화</button>' : ''}
      </div>
    </div>`);
  /* 설정 저장 */
  $('#sSave', o).onclick = async () => {
    await DB.set('meta', 'site', Object.assign({}, st, {
      notice: $('#sNotice', o).value.trim(), threshold: num($('#sThr', o).value) || 600,
      callTargets: $('#sTargets', o).value.trim(), updatedAt: Date.now()
    }));
    toast('설정을 저장했어요!');
  };
  /* 멤버 목록 */
  const memWrap = $('#memRows', o);
  const memRow = m => {
    const r = document.createElement('div'); r.className = 'arow'; r.dataset.nick = m.nick;
    r.innerHTML = `<div style="font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.nick)}</div>
      <select class="inp rRole">${['길드원', '부길마', '길마'].map(x => `<option ${m.role === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <input class="inp rLv" value="${esc(m.lv)}" inputmode="numeric">
      <button class="smallbtn rDel" style="color:var(--bad)">삭제</button>`;
    $('.rDel', r).onclick = () => confirmBox(m.nick + ' 님을 명단에서 삭제할까요? 지난 주차 기록은 남아있어요.', async () => { await DB.del('members', m.nick); r.remove(); toast('삭제했어요'); });
    memWrap.appendChild(r);
  };
  roster().forEach(memRow);
  const cleanNick = s => s.replace(/[\/\\]/g, ' ').trim().slice(0, 20);
  const addMember = async (nick, role, lv) => {
    nick = cleanNick(nick); if (!nick) return false;
    if (DB.get('members', nick)) { toast('"' + nick + '" 님은 이미 있어요!'); return false; }
    const m = { nick, role: role || '길드원', lv: num(lv) || '', title: '', card: null, updatedAt: Date.now() };
    await DB.set('members', nick, m); memRow(m); return true;
  };
  $('#memAdd', o).onclick = async () => {
    if (await addMember($('#newNick', o).value, $('#newRole', o).value, $('#newLv', o).value)) {
      $('#newNick', o).value = ''; $('#newLv', o).value = ''; toast('추가했어요! 🐯');
    }
  };
  $('#bulkGo', o).onclick = async () => {
    const lines = $('#bulkAdd', o).value.split('\n').map(l => l.trim()).filter(Boolean);
    let n = 0;
    for (const l of lines) { const p = l.split(','); if (await addMember(p[0], '길드원', p[1])) n++; }
    $('#bulkAdd', o).value = ''; toast(n + '명을 추가했어요! 🐯');
  };
  $('#memSave', o).onclick = async () => {
    for (const r of $$('#memRows .arow', o)) {
      const m = DB.get('members', r.dataset.nick); if (!m) continue;
      const upd = Object.assign({}, m, { role: $('.rRole', r).value, lv: num($('.rLv', r).value) || m.lv });
      delete upd._id;
      await DB.set('members', r.dataset.nick, upd);
    }
    toast('멤버 정보를 저장했어요!');
  };
  /* 주차 목록 */
  const wkWrap = $('#wkList', o);
  weekList().slice().reverse().forEach(w => {
    const r = document.createElement('div'); r.className = 'wkitem';
    r.innerHTML = `<b>${esc(w.label)}</b><span style="color:var(--text2);font-size:12px">${fmtDate(w.base)} ~ ${fmtDate(w.check)}</span>
      <button class="smallbtn wEdit">기록 입력</button><button class="smallbtn wDel" style="color:var(--bad)">삭제</button>`;
    $('.wEdit', r).onclick = () => weekEntryModal(w._id);
    $('.wDel', r).onclick = () => confirmBox('"' + w.label + '" 주차를 삭제할까요? 기록이 사라져요.', async () => { await DB.del('weeks', w._id); r.remove(); toast('삭제했어요'); });
    wkWrap.appendChild(r);
  });
  /* 새 주차 */
  const isoLocal = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const prev = curWeek();
  let defBase;
  if (prev && prev.check) { const d = new Date(prev.check + 'T00:00:00'); d.setDate(d.getDate() + 1); defBase = d; }
  else { const d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7)); defBase = d; }
  const baseInp = $('#nwBase', o), labelInp = $('#nwLabel', o);
  const autoLabel = () => {
    const d = new Date(baseInp.value + 'T00:00:00');
    if (!isNaN(d)) labelInp.value = (d.getMonth() + 1) + '월 ' + Math.ceil(d.getDate() / 7) + '주차';
  };
  baseInp.value = isoLocal(defBase); autoLabel();
  baseInp.addEventListener('change', autoLabel);
  $('#nwGo', o).onclick = async () => {
    const base = baseInp.value; if (!base) return toast('시작일을 선택해주세요!');
    const label = labelInp.value.trim() || base;
    const d = new Date(base + 'T00:00:00'); d.setDate(d.getDate() + 6);
    const rows = {};
    roster().forEach(m => { const pr = prev ? rowOf(prev, m.nick) : { c: 0, w: 0 }; rows[m.nick] = { b: pr.c || 0, c: 0, w: pr.w || 0 }; });
    const id = 'wk-' + base;
    await DB.set('weeks', id, { label, base, check: isoLocal(d), rows, createdAt: Date.now() });
    closeModal($('#nwGo', o)); toast('"' + label + '" 주차를 만들었어요!'); weekEntryModal(id);
  };
  /* 기타 */
  $('#adLock', o).onclick = () => { setAdmin(false); closeModal($('#adLock', o)); toast('관리자 잠금!'); render(); };
  const dr = $('#demoReset', o);
  if (dr) dr.onclick = () => confirmBox('데모 데이터를 처음 상태로 되돌릴까요?', () => {
    try { localStorage.removeItem(DB.LS_KEY); localStorage.removeItem(MINE_KEY); } catch (e) {}
    location.reload();
  });
}
function weekEntryModal(weekId) {
  const w = DB.get('weeks', weekId); if (!w) return;
  const o = openModal(w.label + ' 기록 입력', `
    <p class="mnote" style="margin-top:0">누적(월요일 기준) → 확인(일요일 기준) 수치를 입력해주세요. 증가량·상태는 자동 계산!</p>
    <div class="wrow" style="color:var(--text2);font-size:11.5px"><span>닉네임</span><span>누적</span><span>확인</span><span>경고</span></div>
    <div id="weRows"></div>
    <button class="btn" id="weSave">기록 저장</button>`);
  const wrap = $('#weRows', o);
  roster().forEach(m => {
    const r0 = (w.rows && w.rows[m.nick]) || { b: 0, c: 0, w: 0 };
    const r = document.createElement('div'); r.className = 'wrow'; r.dataset.nick = m.nick;
    r.innerHTML = `<span class="wn">${esc(m.nick)}</span>
      <input class="inp eB" inputmode="numeric" value="${esc(r0.b ?? 0)}">
      <input class="inp eC" inputmode="numeric" value="${esc(r0.c ?? 0)}">
      <input class="inp eW" inputmode="numeric" value="${esc(r0.w ?? 0)}">`;
    wrap.appendChild(r);
  });
  $('#weSave', o).onclick = async () => {
    const rows = {};
    $$('#weRows .wrow', o).forEach(r => {
      rows[r.dataset.nick] = { b: num($('.eB', r).value), c: num($('.eC', r).value), w: num($('.eW', r).value) };
    });
    const upd = Object.assign({}, w, { rows }); delete upd._id;
    await DB.set('weeks', weekId, upd);
    closeModal($('#weSave', o)); toast('기록을 저장했어요! 📊');
  };
}

/* ================= 이벤트 ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === 'filter') { S.filter = t.dataset.v; render(); }
  else if (act === 'shareTab') { S.shareTab = t.dataset.v; S.modeFilter = '전체'; render(); }
  else if (act === 'modeFilter') { S.modeFilter = t.dataset.v; render(); }
  else if (act === 'editMember') memberModal(id);
  else if (act === 'addVideo') videoModal();
  else if (act === 'addTip') tipModal();
  else if (act === 'addComment') commentModal();
  else if (act === 'editComment') commentModal(id);
  else if (act === 'delComment') confirmBox('이 건의사항을 삭제할까요?', () => DB.del('comments', id));
  else if (act === 'delVideo') confirmBox('이 영상을 삭제할까요?', () => DB.del('videos', id));
  else if (act === 'delTip') confirmBox('이 팁을 삭제할까요?', () => DB.del('tips', id));
  else if (act === 'expand') t.classList.toggle('clamp');
  else if (act === 'playVideo') {
    const box = t.closest('.vthumb') || t;
    const vid = t.dataset.id;
    const holder = document.createElement('div'); holder.className = 'vthumb';
    holder.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${esc(vid)}?autoplay=1" title="플레이 영상" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    box.replaceWith(holder);
  }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-act="sort"]')) { S.sort = e.target.value; render(); }
});
$('#navBar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  S.tab = b.dataset.tab; render(); window.scrollTo({ top: 0 });
});
$('#fabCall').addEventListener('click', callModal);
$('#fabGear').addEventListener('click', adminGate);

/* ================= 시작 ================= */
DB.subscribe(render);
(async function start() {
  await DB.init();
  initKakao();
  render();
})();
</script>
<!--/A:BODY-->
</body>
</html>
