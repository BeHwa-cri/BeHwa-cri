<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!--A:HEAD-->
<title>호랑이굴</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: phone-first single column app shell — sticky header, card stack, fixed bottom tab bar */
:root{
  --bg:#f6f1e8;
  --surface:#fffdf8;
  --surface2:#f1e9da;
  --text:#2c2418;
  --text2:#8b7f6c;
  --line:#e7ddca;
  --brand:#df661d;
  --brand-deep:#b04a0e;
  --brand-soft:#fbe8d6;
  --on-brand:#ffffff;
  --ok:#1f8a5f;
  --ok-soft:#e1f2e9;
  --bad:#cf4536;
  --bad-soft:#fbe6e2;
  --warn:#b97a10;
  --warn-soft:#faeed3;
  --hero1:#ff9a43;
  --hero2:#e0661c;
  --hero3:#9c3c06;
  --nav-bg:rgba(255,253,248,.95);
  --note:#fcf2c4;
  --note-ink:#9a7a0e;
  --gc:#99a0a8;
  --gb:#41a06a;
  --ga:#4287c8;
  --gs:#a05cd6;
  --gss:#c8930c;
  --gsss:#e35514;
  --shadow:0 10px 26px rgba(60,42,20,.09);
  --font-disp:"Jua","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --font-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191410;
    --surface:#221c14;
    --surface2:#2d251a;
    --text:#f3ebdd;
    --text2:#a29683;
    --line:#3a3122;
    --brand:#f58434;
    --brand-deep:#ffb277;
    --brand-soft:#3b2a17;
    --on-brand:#241303;
    --ok:#4cc08d;
    --ok-soft:#1c3a2c;
    --bad:#f57e6e;
    --bad-soft:#452622;
    --warn:#e2a844;
    --warn-soft:#3e3118;
    --nav-bg:rgba(30,24,17,.95);
    --note:#38301a;
    --note-ink:#d9b64a;
    --gc:#7e858d;
    --gb:#4bb87c;
    --ga:#5a9bd8;
    --gs:#b57ae2;
    --gss:#d9a81e;
    --gsss:#f06a28;
    --shadow:0 10px 26px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191410;
  --surface:#221c14;
  --surface2:#2d251a;
  --text:#f3ebdd;
  --text2:#a29683;
  --line:#3a3122;
  --brand:#f58434;
  --brand-deep:#ffb277;
  --brand-soft:#3b2a17;
  --on-brand:#241303;
  --ok:#4cc08d;
  --ok-soft:#1c3a2c;
  --bad:#f57e6e;
  --bad-soft:#452622;
  --warn:#e2a844;
  --warn-soft:#3e3118;
  --nav-bg:rgba(30,24,17,.95);
  --note:#38301a;
  --note-ink:#d9b64a;
  --gc:#7e858d;
  --gb:#4bb87c;
  --ga:#5a9bd8;
  --gs:#b57ae2;
  --gss:#d9a81e;
  --gsss:#f06a28;
  --shadow:0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
img{max-width:100%}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.wrap{max-width:620px;margin:0 auto;padding:0 16px 132px}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--nav-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:620px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.hdr .logo{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);border:2px dashed var(--brand);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;transform:rotate(-8deg)}
.adminbtn{flex-shrink:0;width:34px;height:34px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text2);font-size:15px;display:flex;align-items:center;justify-content:center}
.hdr .tt{min-width:0;flex:1}
.hdr h1{margin:0;font-family:var(--font-disp);font-weight:400;font-size:19px;letter-spacing:.2px;line-height:1.2}
.hdr .sub{font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub b{color:var(--bad);font-weight:600}
.weekchip{flex-shrink:0;background:var(--brand-soft);color:var(--brand-deep);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:999px}

/* ---------- demo banner ---------- */
.demobar{background:var(--warn-soft);color:var(--warn);font-size:12.5px;padding:8px 16px;text-align:center;border-bottom:1px solid var(--line)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:800}
.card .desc{font-size:12.5px;color:var(--text2);margin:0 0 10px}

/* ---------- 주간 현황 (D-day + 진행률) ---------- */
.ovr{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:15px;display:flex;gap:14px;align-items:stretch}
.dday{flex-shrink:0;min-width:96px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:linear-gradient(160deg,var(--hero1),var(--hero3));color:#fff;border-radius:16px;padding:12px 10px}
.dday .dl{font-size:10.5px;opacity:.92}
.dday .dv{font-family:var(--font-disp);font-size:27px;line-height:1.15;text-shadow:0 2px 6px rgba(0,0,0,.2)}
.dday .dm{font-size:15px;margin-top:2px}
.ovr .rt{min-width:0;flex:1}
.greet2{font-size:11.5px;color:var(--text2)}
.ovr .wk{font-family:var(--font-disp);font-size:22px;line-height:1.2;margin-top:1px}
.ovr .dates{font-size:11.5px;color:var(--text2);margin-top:3px}
.pbarwrap{margin-top:9px}
.pbar{height:9px;background:var(--surface2);border-radius:999px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .4s}
.pbtxt{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:4px;font-variant-numeric:tabular-nums}

/* ---------- 공지 포스트잇 ---------- */
.note{margin-top:16px;background:var(--note);border-radius:4px 18px 18px 18px;padding:13px 16px 12px;transform:rotate(-.5deg);box-shadow:var(--shadow);position:relative;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.note::before{content:"📌";position:absolute;top:-11px;left:10px;font-size:19px;transform:rotate(14deg)}
.note .nt{font-weight:800;font-size:11.5px;color:var(--note-ink);letter-spacing:.5px;margin-bottom:4px}

/* ---------- 필터 세그먼트 + 멤버 진행바 행 ---------- */
.filtrow{display:flex;gap:8px;margin-top:16px;align-items:center}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;flex:1}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg button.on.okk{color:var(--ok)}
.seg button.on.badd{color:var(--bad)}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 11px;margin-top:10px}
.mrow .toprow{display:flex;align-items:baseline;gap:7px}
.mrow .nm{font-weight:800;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .lvt{font-size:11px;color:var(--text2);font-weight:700;flex-shrink:0}
.mrow .df{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0}
.mrow.done .df{color:var(--ok)}
.mrow.miss .df{color:var(--bad)}
.mbar{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:8px}
.mbar>i{display:block;height:100%;border-radius:999px}
.mrow.done .mbar>i{background:var(--ok)}
.mrow.miss .mbar>i{background:var(--bad)}
.mrow .sub{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--text2);margin-top:7px;font-variant-numeric:tabular-nums}
.statb{font-size:10.5px;font-weight:800;border-radius:7px;padding:2px 7px;flex-shrink:0}
.mrow.done .statb{background:var(--ok-soft);color:var(--ok)}
.mrow.miss .statb{background:var(--bad-soft);color:var(--bad)}

/* ---------- call banner & notice ---------- */
.callbar{margin-top:14px;background:var(--brand-soft);border:1px solid var(--brand);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--brand-deep);display:flex;gap:8px;align-items:flex-start}
.notice{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.notice summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.notice summary::-webkit-details-marker{display:none}
.notice summary .arr{margin-left:auto;color:var(--text2);transition:transform .2s}
.notice[open] summary .arr{transform:rotate(90deg)}
.notice .nbody{padding:0 14px 12px;font-size:13.5px;color:var(--text);white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:10px}

/* ---------- chips / filters ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--text2)}
.chip .n{font-weight:800;margin-left:3px}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip.ok-on{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.bad-on{background:var(--bad);border-color:var(--bad);color:#fff}
.selwrap{margin-left:auto}
select.sel{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 28px 7px 14px;font-size:13px;font-weight:600;color:var(--text2);background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}

/* ---------- contribution table ---------- */
.tblwrap{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11.5px;color:var(--text2);font-weight:600;text-align:left;padding:10px 7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 7px;font-size:13.5px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:none}
td.nick{font-weight:700;position:relative;padding-left:13px;max-width:112px;overflow:hidden;text-overflow:ellipsis}
td.nick::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0}
tr.done td.nick::before{background:var(--ok)}
tr.miss td.nick::before{background:var(--bad)}
.lvb{display:inline-block;background:var(--surface2);color:var(--text2);border-radius:8px;padding:2px 7px;font-size:11.5px;font-weight:700}
.acc{color:var(--text2);font-size:12.5px}
.acc b{color:var(--text);font-size:13.5px}
td.diff{font-weight:800}
tr.done td.diff{color:var(--ok)}
tr.miss td.diff{color:var(--bad)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
.warnb{display:inline-block;background:var(--warn-soft);color:var(--warn);font-weight:800;font-size:12px;border-radius:8px;padding:2px 8px}
.thr{font-size:12px;color:var(--text2);margin-top:10px;text-align:center}

/* ---------- weekly chart & matrix ---------- */
.chart text{fill:var(--text2);font-size:11px;font-family:var(--font-body)}
.chart .val{fill:var(--text);font-weight:700;font-size:11.5px}
.chart .bar{fill:var(--brand)}
.chart .axis{stroke:var(--line)}
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.cellv{display:inline-block;min-width:52px;border-radius:9px;padding:3px 8px;font-size:12.5px;font-weight:700}
.cellv.ok{background:var(--ok-soft);color:var(--ok)}
.cellv.bad{background:var(--bad-soft);color:var(--bad)}
.cellv.na{color:var(--text2);font-weight:500}

/* ---------- 유저정보 프로필 스트립 ---------- */
.pstrip{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:10px;overflow:hidden}
.pshead{display:flex;align-items:center;gap:11px;padding:12px 14px;width:100%;text-align:left}
.pavatar{width:40px;height:40px;border-radius:14px;background:var(--surface2);color:var(--text2);font-weight:800;font-family:var(--font-disp);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;transform:rotate(-4deg)}
.pstrip.r0 .pavatar{background:var(--brand);color:var(--on-brand)}
.pstrip.r1 .pavatar{background:var(--brand-soft);color:var(--brand-deep)}
.psmeta{min-width:0;flex:1}
.psnm{font-weight:800;font-size:14.5px;display:flex;gap:6px;align-items:center}
.pssub{font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:1px}
.psarr{color:var(--text2);font-size:16px;transition:transform .2s;flex-shrink:0}
.pstrip.open .psarr{transform:rotate(90deg)}
.psbody{border-top:1px dashed var(--line);padding:13px 14px 14px}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stile{background:var(--surface2);border-radius:12px;padding:10px 8px;text-align:center}
.stile .k{font-size:10.5px;color:var(--text2)}
.stile .v{font-weight:800;font-size:15px;margin-top:2px}
.seclab{font-size:10.5px;font-weight:800;color:var(--text2);letter-spacing:.5px;margin:13px 0 2px}
.unit{background:var(--surface2);border-radius:12px;padding:8px 11px;margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.unit .un{font-weight:800;font-size:13px}
.unit .ul{font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums}
.ustat{display:inline-flex;align-items:baseline;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:10px;font-weight:700;color:var(--text2);white-space:nowrap}
.ustat b{font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums}
.ustat.lib b{color:var(--brand-deep)}
.ugems{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.gchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2.5px 8px 2.5px 3px;font-size:11px;font-weight:700}
.gchip.sp{border:1.5px dashed var(--brand)}
.gg{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:16px;border-radius:999px;color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:0 5px}
.g-c{background:var(--gc)}.g-b{background:var(--gb)}.g-a{background:var(--ga)}.g-s{background:var(--gs)}
.g-ss{background:var(--gss);color:#241b02}.g-sss{background:var(--gsss)}
.dcard{border:1.5px dashed var(--line);border-radius:14px;padding:10px;margin-top:10px}
.grow{display:grid;grid-template-columns:52px 80px 1fr;gap:6px;margin-top:6px;align-items:center}
.grow .inp{padding:8px 9px;font-size:13px}
.gslot{font-size:10px;font-weight:800;color:var(--text2);text-align:center;background:var(--surface2);border-radius:8px;padding:7px 0}
.gslot.sp{color:var(--brand-deep);background:var(--brand-soft)}
.cardempty{color:var(--text2);font-size:13px;text-align:center;padding:12px 0;border:1.5px dashed var(--line);border-radius:12px}
.editbtn{margin-top:12px;width:100%;background:var(--brand-soft);color:var(--brand-deep);font-weight:800;border-radius:12px;padding:10px 0;font-size:13px}

/* ---------- member cards ---------- */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px;width:100%;text-align:left;display:block;transition:transform .12s}
.mcard:active{transform:scale(.985)}
.mcard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mcard .nm{font-weight:800;font-size:15.5px}
.roleb{font-size:11px;font-weight:800;border-radius:8px;padding:2.5px 8px}
.roleb.r0{background:var(--brand);color:var(--on-brand)}
.roleb.r1{background:var(--brand-soft);color:var(--brand-deep)}
.roleb.r2{background:var(--surface2);color:var(--text2)}
.mcard .meta{font-size:12.5px;color:var(--text2);margin-top:3px}
.mcard .empty{color:var(--text2);font-size:13px;margin-top:8px;text-align:center;padding:10px 0;border:1.5px dashed var(--line);border-radius:12px}
.kv{display:flex;justify-content:space-between;gap:10px;background:var(--surface2);border-radius:12px;padding:9px 12px;margin-top:8px;font-size:13.5px}
.kv .k{color:var(--text2)}
.kv .v{font-weight:800}
.dealers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.dealer{background:var(--surface2);border-radius:12px;padding:8px 6px;text-align:center}
.dealer .dn{font-weight:800;font-size:12.5px}
.dealer .dl{font-size:11px;color:var(--text2);margin-top:2px}
.mcard .upd{font-size:11px;color:var(--text2);text-align:right;margin-top:10px}

/* ---------- share (videos & tips) ---------- */
.subtabs{display:flex;background:var(--surface2);border-radius:14px;padding:4px;margin-top:14px}
.subtabs button{flex:1;border-radius:11px;padding:9px 0;font-weight:700;font-size:13.5px;color:var(--text2)}
.subtabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.addbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:14px;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:14.5px;border-radius:16px;padding:14px 0;box-shadow:var(--shadow)}
.hint{font-size:12px;color:var(--text2);margin-top:8px;text-align:center}
.vthumb{position:relative;display:block;margin-top:10px;border-radius:14px;overflow:hidden;background:var(--surface2);aspect-ratio:16/9;max-width:100%}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;background:rgba(0,0,0,.25);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.vthumb iframe{width:100%;height:100%;border:0;display:block}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
.pcard .pt{font-weight:800;font-size:14.5px}
.pcard .pm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--text2)}
.modeb{background:var(--brand-soft);color:var(--brand-deep);font-weight:700;border-radius:8px;padding:2px 8px;font-size:11.5px}
.pcard .pb{font-size:13.5px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.pcard .pb.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pacts{display:flex;gap:6px;margin-left:auto}
.iconb{width:32px;height:32px;border-radius:10px;background:var(--surface2);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:14px}
.linkout{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--surface2);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;color:var(--brand-deep)}

/* ---------- video comments & custom tips ---------- */
.tob{background:var(--brand);color:var(--on-brand);font-weight:800;border-radius:8px;padding:2px 9px;font-size:11.5px}
.vcm{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}

<script>
'use strict';
/* ================= 설정 ================= */
const CFG = Object.assign({
  firebase: null, kakaoJsKey: '', adminCode: '0000', memberCode: '', openChatUrl: '',
  clanName: '호랑이', gameName: '협동타워디펜스'
}, (typeof window !== 'undefined' && window.SITE_CONFIG) || {});
const PREVIEW = !!window.__PREVIEW__;
const LIVE = !!(CFG.firebase && CFG.firebase.apiKey && !PREVIEW);

/* ================= 유틸 ================= */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseInt(String(v == null ? '' : v).replace(/[^\d-]/g, ''), 10); return isNaN(n) ? 0 : n; };
const DOW = '일월화수목금토';
function fmtDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일(' + DOW[d.getDay()] + ')';
}
function fmtTs(ms) {
  if (!ms) return '';
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function shortWeek(label) {
  const m = /(\d+)월\s*(\d+)\s*주차/.exec(label || '');
  return m ? m[1] + '/' + m[2] + '주' : String(label || '').slice(0, 6);
}
function ytId(url) {
  const m = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{6,})/.exec(url || '');
  return m ? m[1] : null;
}
function loadScript(src) {
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => no(new Error('load fail: ' + src));
    document.head.appendChild(s);
  });
}
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
/* 내가 쓴 글(이 기기) 추적 — 수정/삭제 버튼 노출용 */
const MINE_KEY = 'tg-mine-v1';
const mine = lsGet(MINE_KEY, { comments: [], videos: [], tips: [], vcomments: [] });
function markMine(kind, id) { (mine[kind] = mine[kind] || []).push(id); lsSet(MINE_KEY, mine); }
function isMine(kind, id) { return (mine[kind] || []).includes(id); }

/* ================= 데모 데이터 ================= */
function demoData() {
  const now = Date.now();
  const M = (nick, role, lv, title, card, t) => ({ nick, role, lv, title: title || '', card: card || null, updatedAt: t || now - 86400000 });
  const members = {};
  [
    M('어흥대장', '길마', 24, '숲의 지배자', {
      avgLv: '22', mainDealer: '오깜아캣',
      dealers: [
        { n: '아이비', lv: '풀', lib: '풀', gems: [{ g: 'SSS', n: '파멸' }, { g: 'S', n: '근원' }, { g: 'SS', n: '전투' }] },
        { n: '마캣', lv: '16', lib: '풀', gems: [{ g: 'SS', n: '질풍' }, { g: 'S', n: '행운' }, { g: 'A', n: '파도' }] },
        { n: '오멘', lv: '16', lib: '20', gems: [{ g: 'S', n: '연격' }, { g: '', n: '' }, { g: 'B', n: '격파' }] },
        { n: '깜쥐', lv: '16', lib: '16' }, { n: '빙결', lv: '16', lib: '17' }, { n: '헬기', lv: '16', lib: '11' },
        { n: '청룡', lv: '11', lib: '10' }, { n: '부두', lv: '11', lib: '6' }
      ]
    }, now - 3600000 * 30),
    M('꼬랑지', '부길마', 23, '어흥 부단장', {
      avgLv: '21', mainDealer: '아이비',
      dealers: [
        { n: '아이비', lv: '16', lib: '18', gems: [{ g: 'SS', n: '파멸' }, { g: 'S', n: '근원' }, { g: 'C', n: '신속' }] },
        { n: '오멘', lv: '15', lib: '12' }, { n: '빙결', lv: '14', lib: '9' }
      ]
    }, now - 3600000 * 51),
    M('줄무늬', '마왕군원', 22), M('앞발펀치', '마왕군원', 21), M('호피', '마왕군원', 20),
    M('냥젤리', '마왕군원', 19), M('숲의왕', '마왕군원', 18), M('아기호랑', '마왕군원', 18)
  ].forEach(m => members[m.nick] = m);
  const R = (b, c, w) => ({ b, c, w: w || 0 });
  const weeks = {
    w1: { label: '9월 3주차', base: '2026-09-14', check: '2026-09-20', createdAt: now - 86400000 * 17, rows: {
      '어흥대장': R(520, 1180), '꼬랑지': R(480, 1100), '줄무늬': R(300, 980), '앞발펀치': R(410, 1020),
      '호피': R(260, 870), '냥젤리': R(150, 770), '숲의왕': R(90, 700), '아기호랑': R(0, 320) } },
    w2: { label: '9월 4주차', base: '2026-09-21', check: '2026-09-27', createdAt: now - 86400000 * 10, rows: {
      '어흥대장': R(1180, 1840), '꼬랑지': R(1100, 1710), '줄무늬': R(980, 1500), '앞발펀치': R(1020, 1640),
      '호피': R(870, 1150), '냥젤리': R(770, 1390), '숲의왕': R(700, 1310), '아기호랑': R(320, 930, 1) } },
    w3: { label: '10월 1주차', base: '2026-09-28', check: '2026-10-04', createdAt: now - 86400000 * 3, rows: {
      '어흥대장': R(1840, 2470), '꼬랑지': R(1710, 0), '줄무늬': R(1500, 2150), '앞발펀치': R(1640, 0),
      '호피': R(1150, 0, 1), '냥젤리': R(1390, 2000), '숲의왕': R(1310, 0), '아기호랑': R(930, 0, 1) } }
  };
  return {
    meta: { site: {
      notice: '매주 일요일 21시까지 기여도 확인 부탁드려요!\n2주 연속 미달이면 경고 1회… 어흥 🐯\n신규 마왕군원은 유저정보 카드를 꼭 채워주세요.',
      threshold: 600, callTargets: '어흥대장, 꼬랑지', updatedAt: now
    } },
    members, weeks,
    comments: { c1: { text: '우리 마왕군 사이트 생긴 거 실화인가요?? 너무 좋아요~!!', ts: now - 86400000 * 2 } },
    videos: { v1: {
      title: '(예시) 무한 모드 120웨이브 빙결 덱', mode: '무한 모드',
      url: 'https://youtu.be/0000000000o', nick: '어흥대장', ts: now - 86400000 * 3 } },
    vcomments: { vc1: { vid: 'v1', nick: '냥젤리', text: '와 배치 미쳤다… 바로 따라했어요!!', ts: now - 86400000 * 2 } },
    tips: {
      t1: { target: '아기호랑', body: '빙결은 16까지만 먼저 올리고, 해방은 주말 2배 이벤트 때 몰아서 하는 걸 추천! 지금은 오멘 레벨업이 더 급해요.', from: '어흥대장', ts: now - 86400000 * 2 },
      t2: { target: '전체', body: '이번 주 토벌전은 빙결 덱이 효율 최고! 배치 순서는 영상 탭 클립 참고해주세요 🐯', from: '운영진', ts: now - 86400000 * 4 }
    },
    calls: {}
  };
}

/* ================= 데이터 계층 (로컬 데모 ↔ Firebase) ================= */
const COLS = ['meta', 'members', 'weeks', 'comments', 'videos', 'vcomments', 'tips', 'calls'];
const DB = {
  data: {}, subs: [], fs: null, ready: false,
  LS_KEY: 'tg-db-v1',
  emit() { this.subs.forEach(f => { try { f(); } catch (e) { console.error(e); } }); },
  subscribe(f) { this.subs.push(f); },
  persist() { if (!LIVE) lsSet(this.LS_KEY, this.data); },
  async init() {
    COLS.forEach(c => this.data[c] = {});
    if (LIVE) {
      try {
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
        firebase.initializeApp(CFG.firebase);
        this.fs = firebase.firestore();
        COLS.forEach(c => this.fs.collection(c).onSnapshot(
          snap => { const m = {}; snap.forEach(d => m[d.id] = d.data()); this.data[c] = m; this.ready = true; this.emit(); },
          err => { console.error(err); toast('데이터 연결 오류: ' + err.code); }
        ));
      } catch (e) { console.error(e); toast('Firebase 연결에 실패했어요. firebase-config.js를 확인해주세요.'); }
    } else {
      const saved = lsGet(this.LS_KEY, null);
      this.data = saved && saved.members ? Object.assign(this.data, saved) : demoData();
      COLS.forEach(c => this.data[c] = this.data[c] || {});
      this.ready = true; this.persist(); this.emit();
    }
  },
  async set(col, id, obj) {
    if (LIVE) { try { await this.fs.collection(col).doc(id).set(obj); } catch (e) { console.error(e); toast('저장에 실패했어요 😿'); throw e; } }
    else { this.data[col][id] = obj; this.persist(); this.emit(); }
  },
  async del(col, id) {
    if (LIVE) { try { await this.fs.collection(col).doc(id).delete(); } catch (e) { console.error(e); toast('삭제에 실패했어요 😿'); throw e; } }
    else { delete this.data[col][id]; this.persist(); this.emit(); }
  },
  get(col, id) { return this.data[col] ? this.data[col][id] : null; },
  list(col) { return Object.entries(this.data[col] || {}).map(([id, v]) => Object.assign({ _id: id }, v)); }
};

/* ================= 파생 데이터 ================= */
const site = () => DB.get('meta', 'site') || { notice: '', threshold: 600, callTargets: '' };
const ROLE_ORDER = { '길마': 0, '부길마': 1, '마왕군원': 2, '길드원': 2 }; /* '길드원'은 예전 데이터 호환용 */
const roster = () => DB.list('members').sort((a, b) =>
  (ROLE_ORDER[a.role] ?? 9) - (ROLE_ORDER[b.role] ?? 9) || String(a.nick).localeCompare(String(b.nick), 'ko'));
const weekList = () => DB.list('weeks').sort((a, b) => String(a.base).localeCompare(String(b.base)));
const isoToday = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
/* 홈에 보여줄 '현재 주차' = 시작일이 오늘 이전인 주차 중 가장 최근 것.
   미리 만들어 둔 다음 주차는 월요일이 되면 자동으로 홈에 올라와요. */
const curWeek = () => {
  const w = weekList(); if (!w.length) return null;
  const t = isoToday();
  const started = w.filter(x => String(x.base || '') <= t);
  return started.length ? started[started.length - 1] : w[0];
};
function rowOf(week, nick) {
  const r = (week && week.rows && week.rows[nick]) || { b: 0, c: 0, w: 0 };
  return { b: num(r.b), c: num(r.c), w: num(r.w), diff: num(r.c) - num(r.b) };
}

/* ================= 상태 ================= */
const S = {
  tab: 'members', filter: 'all', sort: 'nick',
  shareTab: 'videos', modeFilter: '전체', tipFilter: '전체', openCm: {}, openMem: {},
  admin: (() => { try { return sessionStorage.getItem('tg-admin') === '1'; } catch (e) { return false; } })(),
  member: (() => { try { return localStorage.getItem('tg-member') === '1'; } catch (e) { return false; } })()
};
function setAdmin(v) { S.admin = v; try { v ? sessionStorage.setItem('tg-admin', '1') : sessionStorage.removeItem('tg-admin'); } catch (e) {} }
function setMember(v) { S.member = v; try { v ? localStorage.setItem('tg-member', '1') : localStorage.removeItem('tg-member'); } catch (e) {} }
/* 멤버 비밀번호가 설정돼 있으면, 인증한 사람만 수정/업로드 가능 */
function canWrite() { return !CFG.memberCode || S.member || S.admin; }

/* ================= 렌더링 ================= */
function render() {
  const wk = curWeek();
  $('#hdrWeek').textContent = wk ? wk.label : '준비 중';
  const bar = $('#demobar');
  if (!LIVE) {
    bar.hidden = false;
    bar.textContent = PREVIEW
      ? '🔍 미리보기 데모 — 데이터는 예시이고, 수정해도 이 기기에만 저장돼요'
      : '🧪 데모 모드 — Firebase 연결(가이드 2단계) 전까지는 수정이 이 기기에만 저장돼요';
  } else bar.hidden = true;
  $$('#navBar button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const v = $('#view');
  if (S.tab === 'contrib') v.innerHTML = viewContrib();
  else if (S.tab === 'weekly') v.innerHTML = viewWeekly();
  else if (S.tab === 'members') v.innerHTML = viewMembers();
  else if (S.tab === 'share') v.innerHTML = viewShare();
  else v.innerHTML = viewBoard();
}

/* ---------- 탭 1 : 기여도 ---------- */
function ddayText(iso) {
  if (!iso) return '-';
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return '-';
  const days = Math.round((d - t) / 86400000);
  if (days > 0) return 'D-' + days;
  if (days === 0) return 'D-DAY';
  return '마감!';
}
/* 호출 배너(+공지 포스트잇) — 공지는 메인(유저정보)에만, 호출 배너는 기여도에도 표시 */
function topBanners(withNotice) {
  const st = site();
  let h = '';
  const calls = DB.list('calls').sort((a, b) => b.ts - a.ts);
  if (calls.length && Date.now() - calls[0].ts < 86400000 * 3)
    h += `<div class="callbar"><span>📣</span><div><b>${esc(calls[0].msg)}</b><br><span style="opacity:.75;font-size:11.5px">${fmtTs(calls[0].ts)} 호출</span></div></div>`;
  if (withNotice && st.notice) h += `<div class="note"><div class="nt">마왕군 공지</div>${esc(st.notice)}</div>`;
  return h;
}
function viewContrib() {
  const wk = curWeek(), st = site(), thr = num(st.threshold);
  let h = '';
  const banners = topBanners(false); /* 기여도 탭엔 호출 배너만, 공지는 메인에서 */

  if (!wk) return banners + onboardCard();

  const rows = roster().map(m => { const r = rowOf(wk, m.nick); return Object.assign({ m }, r, { done: r.diff >= thr }); });
  const doneN = rows.filter(r => r.done).length;
  const pct = rows.length ? Math.round(doneN / rows.length * 100) : 0;

  h += `
  <section class="ovr">
    <div class="dday"><div class="dl">기여도 확인까지</div><div class="dv">${esc(ddayText(wk.check))}</div><div class="dm">🐯</div></div>
    <div class="rt">
      <div class="greet2">이번 주도 어흥차게!</div>
      <div class="wk">${esc(wk.label)}</div>
      <div class="dates">기록 ${fmtDate(wk.base)} · 확인 ${fmtDate(wk.check)}</div>
      <div class="pbarwrap">
        <div class="pbar"><i style="width:${pct}%"></i></div>
        <div class="pbtxt"><span>완료 ${doneN}/${rows.length}명</span><span>${pct}%</span></div>
      </div>
    </div>
  </section>`;
  h += banners;

  const list = rows.filter(r => S.filter === 'all' ? true : S.filter === 'done' ? r.done : !r.done);
  if (S.sort === 'diff') list.sort((a, b) => b.diff - a.diff);
  else if (S.sort === 'lv') list.sort((a, b) => num(b.m.lv) - num(a.m.lv));

  h += `
  <div class="filtrow">
    <div class="seg">
      <button class="${S.filter === 'all' ? 'on' : ''}" data-act="filter" data-v="all">전체 ${rows.length}</button>
      <button class="${S.filter === 'done' ? 'on okk' : ''}" data-act="filter" data-v="done">완료 ${doneN}</button>
      <button class="${S.filter === 'miss' ? 'on badd' : ''}" data-act="filter" data-v="miss">미달 ${rows.length - doneN}</button>
    </div>
    <label class="sr" for="sortSel">정렬</label>
    <select class="sel" id="sortSel" data-act="sort">
      <option value="nick" ${S.sort === 'nick' ? 'selected' : ''}>닉네임순</option>
      <option value="diff" ${S.sort === 'diff' ? 'selected' : ''}>증가량순</option>
      <option value="lv" ${S.sort === 'lv' ? 'selected' : ''}>Lv순</option>
    </select>
  </div>`;
  if (!list.length) h += `<div class="emptybox"><div class="big">🐾</div>해당하는 마왕군원이 없어요</div>`;
  list.forEach(r => {
    const w = r.done ? 100 : Math.max(4, Math.min(96, Math.round((r.diff / (thr || 1)) * 100)));
    h += `<div class="mrow ${r.done ? 'done' : 'miss'}">
      <div class="toprow"><span class="nm">${esc(r.m.nick)}</span><span class="lvt">Lv.${esc(r.m.lv)}</span>
        <span class="df">${r.diff >= 0 ? '+' : ''}${r.diff.toLocaleString()}</span></div>
      <div class="mbar"><i style="width:${w}%"></i></div>
      <div class="sub">
        <span>${r.b.toLocaleString()} → <b style="color:var(--text)">${r.c.toLocaleString()}</b></span>
        <span class="statb">${r.done ? '완료' : '미달'}</span>
        ${r.w > 0 ? `<span class="warnb">경고 ${r.w}</span>` : ''}
        <span style="margin-left:auto">기준 +${thr.toLocaleString()}</span>
      </div>
    </div>`;
  });
  return h;
}
function onboardCard() {
  return `<div class="card" style="text-align:center">
    <div style="font-size:38px">🏗️</div>
    <h2 style="margin-top:6px">아직 준비 중이에요</h2>
    <p class="desc">오른쪽 위 ⚙️ 관리자 메뉴에서<br>마왕군원 명단과 첫 주차를 추가하면 시작돼요!</p></div>`;
}

/* ---------- 탭 2 : 주차별 기여도 ---------- */
function viewWeekly() {
  const wks = weekList().slice(-8), thr = num(site().threshold), ros = roster();
  if (!wks.length) return onboardCard();
  const totals = wks.map(w => {
    let sum = 0, done = 0;
    ros.forEach(m => { const d = rowOf(w, m.nick).diff; if (d > 0) sum += d; if (d >= thr) done++; });
    return { w, sum, done };
  });
  const max = Math.max(1, ...totals.map(t => t.sum));
  const BW = 34, GAP = 30, PAD = 18, H = 190, TOP = 26, BOT = 40;
  const W = PAD * 2 + totals.length * (BW + GAP) - GAP;
  let bars = '';
  totals.forEach((t, i) => {
    const x = PAD + i * (BW + GAP);
    const bh = Math.max(2, (t.sum / max) * (H - TOP - BOT));
    const y = H - BOT - bh, r = 4;
    bars += `<g><title>${esc(t.w.label)} · 합계 +${t.sum.toLocaleString()} · 완료 ${t.done}/${ros.length}</title>
      <path class="bar" d="M${x} ${H - BOT} L${x} ${y + r} Q${x} ${y} ${x + r} ${y} L${x + BW - r} ${y} Q${x + BW} ${y} ${x + BW} ${y + r} L${x + BW} ${H - BOT} Z"/>
      <text class="val" x="${x + BW / 2}" y="${y - 7}" text-anchor="middle">+${t.sum >= 1000 ? (t.sum / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : t.sum}</text>
      <text x="${x + BW / 2}" y="${H - BOT + 16}" text-anchor="middle">${esc(shortWeek(t.w.label))}</text>
      <text x="${x + BW / 2}" y="${H - BOT + 30}" text-anchor="middle" style="font-size:10px">완료 ${t.done}명</text></g>`;
  });
  let h = `<div class="card">
    <h2>주차별 발자국 🐾</h2><p class="desc">주차마다 마왕군 전체가 올린 기여도 합계예요</p>
    <div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="주차별 마왕군 기여도 합계 막대그래프">
      <line class="axis" x1="${PAD - 6}" y1="${H - BOT}" x2="${W - PAD + 6}" y2="${H - BOT}"/>${bars}</svg></div></div>`;

  h += `<div class="card"><h2>마왕군원별 기록 🗂️</h2><p class="desc">주간 기준 +${thr.toLocaleString()} 이상이면 초록색!</p>
  <div style="overflow-x:auto"><table class="mx"><thead><tr><th>닉네임</th>`;
  wks.forEach(w => h += `<th>${esc(shortWeek(w.label))}</th>`);
  h += `</tr></thead><tbody>`;
  ros.forEach(m => {
    h += `<tr><td class="nick" style="padding-left:10px">${esc(m.nick)}</td>`;
    wks.forEach(w => {
      const has = w.rows && w.rows[m.nick];
      if (!has) { h += `<td><span class="cellv na">-</span></td>`; return; }
      const d = rowOf(w, m.nick).diff;
      h += `<td><span class="cellv ${d >= thr ? 'ok' : 'bad'}">${d >= 0 ? '+' : ''}${d.toLocaleString()}</span></td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div></div>`;
  return h;
}

/* ---------- 탭 3 : 유저정보 ---------- */
function roleClass(role) { return role === '길마' ? 'r0' : role === '부길마' ? 'r1' : 'r2'; }
function dispRole(role) { return role === '길드원' ? '마왕군원' : (role || '마왕군원'); } /* 예전 데이터 호환 */
function viewMembers() {
  const ros = roster();
  let h = topBanners(true);
  h += `<p class="hint" style="margin-top:16px">🪪 이름을 누르면 카드가 펼쳐져요${!canWrite() ? '<br>🔐 수정은 멤버 비밀번호 인증 후 가능해요' : ''}</p>`;
  if (!ros.length) return h + onboardCard();
  ros.forEach(m => {
    const c = m.card, open = !!S.openMem[m.nick];
    h += `<div class="pstrip ${roleClass(m.role)}${open ? ' open' : ''}">
      <button class="pshead" data-act="toggleMem" data-id="${esc(m.nick)}">
        <span class="pavatar">${esc(String(m.nick).slice(0, 1))}</span>
        <span class="psmeta">
          <span class="psnm">${esc(m.nick)} <span class="roleb ${roleClass(m.role)}">${esc(dispRole(m.role))}</span></span>
          <span class="pssub">🌿 Lv.${esc(m.lv)}${c && c.mainDealer ? ' · 🎯 ' + esc(c.mainDealer) : ''}${!c ? ' · 아직 빈 카드' : ''}</span>
        </span>
        <span class="psarr">›</span>
      </button>`;
    if (open) {
      h += `<div class="psbody">`;
      if (c) {
        h += `<div class="stats2">
          <div class="stile"><div class="k">흰마물평균Lv</div><div class="v">${esc(c.avgLv || '-')}</div></div>
          <div class="stile"><div class="k">메인딜러</div><div class="v">${esc(c.mainDealer || '-')}</div></div></div>`;
        if (c.dealers && c.dealers.length) {
          h += `<div class="seclab">해방 초마신 목록 · 보석 (◆ 특수)</div>`;
          c.dealers.forEach(d => {
            const chips = (d.gems || []).map((g, i) => {
              if (!g || (!g.n && !g.g)) return '';
              const grade = String(g.g || '').toLowerCase();
              const cls = ['c', 'b', 'a', 's', 'ss', 'sss'].includes(grade) ? grade : '';
              return `<span class="gchip${i === 1 ? ' sp' : ''}">${cls ? `<b class="gg g-${cls}">${esc(grade.toUpperCase())}</b>` : ''}${esc(g.n || '')}</span>`;
            }).join('');
            h += `<div class="unit"><span class="un">${esc(d.n)}</span><span class="ustat">Lv <b>${esc(d.lv || '-')}</b></span><span class="ustat lib">해방 <b>${esc(d.lib || '-')}</b></span>${chips ? `<span class="ugems">${chips}</span>` : ''}</div>`;
          });
        }
        h += `<div class="upd" style="font-size:11px;color:var(--text2);text-align:right;margin-top:10px">최근 수정 · ${fmtTs(m.updatedAt)}</div>`;
      } else {
        h += `<div class="cardempty">아직 빈 카드예요. 주인님 어디 계세요? 🐾</div>`;
      }
      h += `<button class="editbtn" data-act="editMember" data-id="${esc(m.nick)}">✏️ 카드 ${c ? '수정' : '작성'}하기</button></div>`;
    }
    h += `</div>`;
  });
  return h;
}

/* ---------- 탭 4 : 영상 · 팁 ---------- */
function viewShare() {
  let h = `<div class="subtabs">
    <button class="${S.shareTab === 'videos' ? 'on' : ''}" data-act="shareTab" data-v="videos">🎬 플레이 영상</button>
    <button class="${S.shareTab === 'tips' ? 'on' : ''}" data-act="shareTab" data-v="tips">💌 맞춤 팁</button>
  </div>`;
  if (S.shareTab === 'videos') {
    const vids = DB.list('videos').sort((a, b) => b.ts - a.ts);
    const modes = ['전체', ...new Set(vids.map(v => v.mode).filter(Boolean))];
    h += `<button class="addbtn" data-act="addVideo">➕ 내 플레이 영상 공유하기</button>

    if (modes.length > 1) {
      h += `<div class="chips">`;
      modes.forEach(md => h += `<button class="chip ${S.modeFilter === md ? 'on' : ''}" data-act="modeFilter" data-v="${esc(md)}">${esc(md)}</button>`);
      h += `</div>`;
    }
    const list = vids.filter(v => S.modeFilter === '전체' || v.mode === S.modeFilter);
    if (!list.length) h += `<div class="emptybox"><div class="big">🎬</div>아직 공유된 영상이 없어요<br>첫 영상의 주인공이 되어보세요! 어흥</div>`;
    list.forEach(v => {
      const id = ytId(v.url), can = isMine('videos', v._id) || S.admin;
      h += `<div class="pcard" data-vid="${esc(v._id)}">
        <div class="pt">${esc(v.title)}</div>
        <div class="pm">${v.mode ? `<span class="modeb">${esc(v.mode)}</span>` : ''}<span>${esc(v.nick || '익명')}</span><span>·</span><span>${fmtTs(v.ts)}</span>
          ${can ? `<span class="pacts"><button class="iconb" data-act="delVideo" data-id="${esc(v._id)}" aria-label="삭제">🗑️</button></span>` : ''}</div>`;
      if (id && !PREVIEW) {
        h += `<button class="vthumb" data-act="playVideo" data-id="${esc(id)}" aria-label="영상 재생">
          <img src="https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">
          <span class="play">▶</span></button>`;
      }
      h += `<a class="linkout" href="${esc(v.url)}" target="_blank" rel="noopener">🔗 유튜브에서 보기</a>`;
      /* 댓글 */
      const cms = DB.list('vcomments').filter(c => c.vid === v._id).sort((a, b) => a.ts - b.ts);
      const open = !!S.openCm[v._id];
      h += `<div class="vcm"><button class="cmtoggle" data-act="toggleCm" data-id="${esc(v._id)}">💬 댓글 ${cms.length}개 ${open ? '접기 ▲' : '보기 ▼'}</button>`;
      if (open) {
        h += `<div class="cmlist">`;
        if (!cms.length) h += `<div class="cmempty">아직 댓글이 없어요. 첫 감상평을 남겨보세요!</div>`;
        cms.forEach(c => {

    h += S.admin
      ? `<button class="addbtn" data-act="addTip">💌 맞춤 팁 쓰기</button>`
      : `<p class="hint" style="margin-top:14px">💌 운영진이 마왕군원 한 명 한 명에게 남기는 맞춤 팁이에요<br>내 닉네임을 눌러 나에게 온 팁을 확인해보세요!</p>`;
    h += `<div class="chips">`;
    ['전체', ...ros.map(m => m.nick)].forEach(n => {
      const c = n === '전체' ? tips.length : tips.filter(t => (t.target || '전체') === n).length;
      h += `<button class="chip ${S.tipFilter === n ? 'on' : ''}" data-act="tipFilter" data-v="${esc(n)}">${esc(n)}${c ? `<span class="n">${c}</span>` : ''}</button>`;
    });

        ${S.admin ? `<span class="pacts"><button class="iconb" data-act="editTip" data-id="${esc(t._id)}" aria-label="수정">✏️</button><button class="iconb" data-act="delTip" data-id="${esc(t._id)}" aria-label="삭제">🗑️</button></span>` : ''}</div>
        <div class="pb">${esc(t.body)}</div></div>`;
    });
  }
  return h;
}

/* ---------- 탭 5 : 건의사항 ---------- */
function viewBoard() {
  const cs = DB.list('comments').sort((a, b) => b.ts - a.ts);
  let h = `<p class="hint" style="margin-top:16px">🐾 하고 싶은 말을 몰래 남기고 가는 곳 · 닉네임은 기록되지 않아요</p>
  <button class="addbtn" data-act="addComment">➕ 건의사항 작성</button>`;
  if (!cs.length) h += `<div class="emptybox"><div class="big">💬</div>아직 건의사항이 없어요<br>마왕군에 바라는 점을 편하게 남겨주세요!</div>`;
  cs.forEach(c => {
    const canEdit = isMine('comments', c._id), canDel = canEdit || S.admin;
    h += `<div class="ccard"><div class="ct">${esc(c.text)}</div>
      <div class="cm"><span>${fmtTs(c.ts)}${c.edited ? ' (수정됨)' : ''}</span>
      <span class="pacts">
        ${canEdit ? `<button class="iconb" data-act="editComment" data-id="${esc(c._id)}" aria-label="수정">✏️</button>` : ''}
        ${canDel ? `<button class="iconb" data-act="delComment" data-id="${esc(c._id)}" aria-label="삭제">🗑️</button>` : ''}
      </span></div></div>`;
  });
  return h;
}

/* ================= 모달 ================= */
function closeModal(el) { const o = el ? el.closest('.ovl') : $('#modalRoot .ovl:last-child'); if (o) o.remove(); }
function openModal(title, bodyHtml) {
  const o = document.createElement('div');
  o.className = 'ovl';
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="shd"><h3>${esc(title)}</h3><button class="x" data-close aria-label="닫기">✕</button></div>
    <div class="sbody">${bodyHtml}</div></div>`;
  o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-close]')) closeModal(e.target); });
  $('#modalRoot').appendChild(o);
  return o;
}
function confirmBox(msg, onYes) {
  const o = openModal('잠깐만요 🐾', `<p style="margin:6px 0 0;font-size:14.5px">${esc(msg)}</p>
    <div class="btnrow"><button class="btn sub" data-close>취소</button><button class="btn danger" id="cfYes">삭제</button></div>`);
  $('#cfYes', o).onclick = () => { closeModal($('#cfYes', o)); onYes(); };
}

/* ---------- 호출 (오픈채팅으로 알리기) ---------- */
function copyText(t, okMsg) {
  const done = () => toast(okMsg || '복사했어요!');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('복사가 안 되네요 😿'); }
  ta.remove();
}

    <div class="admsec"><h4>📅 주차 관리</h4>
      <div class="wklist" id="wkList"></div>
      <div class="frow"><label for="nwBase">새 주차 시작일 (월요일)</label><input class="inp" id="nwBase" type="date"></div>
      <div class="frow"><label for="nwLabel">주차 이름</label><input class="inp" id="nwLabel" placeholder="예: 10월 2주차"></div>
      <button class="btn" id="nwGo">＋ 새 주차 만들기 (누적은 지난주 확인값으로 자동 입력)</button>
    </div>
    <div class="admsec"><h4>🔧 기타</h4>
      <div class="btnrow">
        <button class="btn sub" id="adLock">관리자 잠금</button>
        ${!LIVE ? '<button class="btn danger" id="demoReset">데모 데이터 초기화</button>' : ''}
      </div>
    </div>`);
  /* 설정 저장 */
  $('#sSave', o).onclick = async () => {
    await DB.set('meta', 'site', Object.assign({}, st, {
      notice: $('#sNotice', o).value.trim(), threshold: num($('#sThr', o).value) || 600,
      callTargets: $('#sTargets', o).value.trim(),
      callPresets: $('#sPresets', o).value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 8),
      updatedAt: Date.now()
    }));
    toast('설정을 저장했어요!');
  };
  /* 멤버 목록 */
  const memWrap = $('#memRows', o);
  const memRow = m => {
    const r = document.createElement('div'); r.className = 'arow'; r.dataset.nick = m.nick;
    r.innerHTML = `<div style="font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.nick)}</div>
      <select class="inp rRole">${['마왕군원', '부길마', '길마'].map(x => `<option ${(m.role === x || (m.role === '길드원' && x === '마왕군원')) ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <input class="inp rLv" value="${esc(m.lv)}" inputmode="numeric">
      <button class="smallbtn rDel" style="color:var(--bad)">삭제</button>`;
    $('.rDel', r).onclick = () => confirmBox(m.nick + ' 님을 명단에서 삭제할까요? 지난 주차 기록은 남아있어요.', async () => { await DB.del('members', m.nick); r.remove(); toast('삭제했어요'); });
    memWrap.appendChild(r);
  };
  roster().forEach(memRow);
  const cleanNick = s => s.replace(/[\/\\]/g, ' ').trim().slice(0, 20);
  const addMember = async (nick, role, lv) => {
    nick = cleanNick(nick); if (!nick) return false;
    if (DB.get('members', nick)) { toast('"' + nick + '" 님은 이미 있어요!'); return false; }
    const m = { nick, role: role || '마왕군원', lv: num(lv) || '', title: '', card: null, updatedAt: Date.now() };
    await DB.set('members', nick, m); memRow(m); return true;
  };
  $('#memAdd', o).onclick = async () => {
    if (await addMember($('#newNick', o).value, $('#newRole', o).value, $('#newLv', o).value)) {
      $('#newNick', o).value = ''; $('#newLv', o).value = ''; toast('추가했어요! 🐯');
    }
  };
  $('#bulkGo', o).onclick = async () => {
    const lines = $('#bulkAdd', o).value.split('\n').map(l => l.trim()).filter(Boolean);
    let n = 0;
    for (const l of lines) { const p = l.split(','); if (await addMember(p[0], '마왕군원', p[1])) n++; }
    $('#bulkAdd', o).value = ''; toast(n + '명을 추가했어요! 🐯');
  };
  $('#memSave', o).onclick = async () => {
    for (const r of $$('#memRows .arow', o)) {
      const m = DB.get('members', r.dataset.nick); if (!m) continue;
      const upd = Object.assign({}, m, { role: $('.rRole', r).value, lv: num($('.rLv', r).value) || m.lv });
      delete upd._id;
      await DB.set('members', r.dataset.nick, upd);
    }
    toast('멤버 정보를 저장했어요!');
  };
  /* 주차 목록 */
  const wkWrap = $('#wkList', o);
  weekList().slice().reverse().forEach(w => {
    const r = document.createElement('div'); r.className = 'wkitem';
    r.innerHTML = `<b>${esc(w.label)}</b><span style="color:var(--text2);font-size:12px">${fmtDate(w.base)} ~ ${fmtDate(w.check)}</span>
      <button class="smallbtn wEdit">기록 입력</button><button class="smallbtn wDel" style="color:var(--bad)">삭제</button>`;
    $('.wEdit', r).onclick = () => weekEntryModal(w._id);
    $('.wDel', r).onclick = () => confirmBox('"' + w.label + '" 주차를 삭제할까요? 기록이 사라져요.', async () => { await DB.del('weeks', w._id); r.remove(); toast('삭제했어요'); });
    wkWrap.appendChild(r);
  });
  /* 새 주차 */
  const isoLocal = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const prev = curWeek();
  let defBase;
  if (prev && prev.check) { const d = new Date(prev.check + 'T00:00:00'); d.setDate(d.getDate() + 1); defBase = d; }
  else { const d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7)); defBase = d; }
  const baseInp = $('#nwBase', o), labelInp = $('#nwLabel', o);
  const autoLabel = () => {
    const d = new Date(baseInp.value + 'T00:00:00');
    if (!isNaN(d)) labelInp.value = (d.getMonth() + 1) + '월 ' + Math.ceil(d.getDate() / 7) + '주차';
  };
  baseInp.value = isoLocal(defBase); autoLabel();
  baseInp.addEventListener('change', autoLabel);
  $('#nwGo', o).onclick = async () => {
    const base = baseInp.value; if (!base) return toast('시작일을 선택해주세요!');
    const label = labelInp.value.trim() || base;
    const d = new Date(base + 'T00:00:00'); d.setDate(d.getDate() + 6);
    const rows = {};
    roster().forEach(m => { const pr = prev ? rowOf(prev, m.nick) : { c: 0, w: 0 }; rows[m.nick] = { b: pr.c || 0, c: 0, w: pr.w || 0 }; });
    const id = 'wk-' + base;
    await DB.set('weeks', id, { label, base, check: isoLocal(d), rows, createdAt: Date.now() });
    closeModal($('#nwGo', o)); toast('"' + label + '" 주차를 만들었어요!'); weekEntryModal(id);
  };
  /* 기타 */
  $('#adLock', o).onclick = () => { setAdmin(false); closeModal($('#adLock', o)); toast('관리자 잠금!'); render(); };
  const dr = $('#demoReset', o);
  if (dr) dr.onclick = () => confirmBox('데모 데이터를 처음 상태로 되돌릴까요?', () => {
    try { localStorage.removeItem(DB.LS_KEY); localStorage.removeItem(MINE_KEY); } catch (e) {}
    location.reload();
  });
}
function weekEntryModal(weekId) {
  const w = DB.get('weeks', weekId); if (!w) return;
  const o = openModal(w.label + ' 기록 입력', `
    <p class="mnote" style="margin-top:0">누적(월요일 기준) → 확인(일요일 기준) 수치를 입력해주세요. 증가량·상태는 자동 계산!</p>
    <div class="wrow" style="color:var(--text2);font-size:11.5px"><span>닉네임</span><span>누적</span><span>확인</span><span>경고</span></div>
    <div id="weRows"></div>
    <button class="btn" id="weSave">기록 저장</button>`);
  const wrap = $('#weRows', o);
  roster().forEach(m => {
    const r0 = (w.rows && w.rows[m.nick]) || { b: 0, c: 0, w: 0 };
    const r = document.createElement('div'); r.className = 'wrow'; r.dataset.nick = m.nick;
    r.innerHTML = `<span class="wn">${esc(m.nick)}</span>
      <input class="inp eB" inputmode="numeric" value="${esc(r0.b ?? 0)}">
      <input class="inp eC" inputmode="numeric" value="${esc(r0.c ?? 0)}">
      <input class="inp eW" inputmode="numeric" value="${esc(r0.w ?? 0)}">`;
    wrap.appendChild(r);
  });
  $('#weSave', o).onclick = async () => {
    const rows = {};
    $$('#weRows .wrow', o).forEach(r => {
      rows[r.dataset.nick] = { b: num($('.eB', r).value), c: num($('.eC', r).value), w: num($('.eW', r).value) };
    });
    const upd = Object.assign({}, w, { rows }); delete upd._id;
    await DB.set('weeks', weekId, upd);
    closeModal($('#weSave', o)); toast('기록을 저장했어요! 📊');
  };
}

/* ================= 이벤트 ================= */
const MEMBER_ACTS = ['editMember', 'addVideo', 'addVcm', 'addComment', 'editComment'];
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (MEMBER_ACTS.includes(act) && !canWrite()) { memberGate(() => doAct(act, id)); return; }
  doAct(act, id, t);
});
function doAct(act, id, t) {
  if (act === 'filter') { S.filter = t.dataset.v; render(); }
  else if (act === 'shareTab') { S.shareTab = t.dataset.v; S.modeFilter = '전체'; render(); }
  else if (act === 'modeFilter') { S.modeFilter = t.dataset.v; render(); }
  else if (act === 'tipFilter') { S.tipFilter = t.dataset.v; render(); }
  else if (act === 'editMember') memberModal(id);
  else if (act === 'addVideo') videoModal();
  else if (act === 'addTip') tipModal();
  else if (act === 'editTip') tipModal(id);
  else if (act === 'toggleCm') { S.openCm[id] = !S.openCm[id]; render(); }
  else if (act === 'toggleMem') { S.openMem[id] = !S.openMem[id]; render(); }
  else if (act === 'addVcm') {
    const f = $('.cmform[data-cmv="' + id + '"]');
    if (!f) return;
    const txt = $('.cmt', f).value.trim();
    if (!txt) return toast('댓글 내용을 입력해주세요!');
    const cid = uid();
    markMine('vcomments', cid);
    DB.set('vcomments', cid, { vid: id, nick: $('.cmn', f).value.trim(), text: txt, ts: Date.now() });
  }
  else if (act === 'delVcm') confirmBox('이 댓글을 삭제할까요?', () => DB.del('vcomments', id));
  else if (act === 'addComment') commentModal();
  else if (act === 'editComment') commentModal(id);
  else if (act === 'delComment') confirmBox('이 건의사항을 삭제할까요?', () => DB.del('comments', id));
  else if (act === 'delVideo') confirmBox('이 영상을 삭제할까요?', () => DB.del('videos', id));
  else if (act === 'delTip') confirmBox('이 팁을 삭제할까요?', () => DB.del('tips', id));
  else if (act === 'expand') t.classList.toggle('clamp');
  else if (act === 'playVideo') {
    const box = t.closest('.vthumb') || t;
    const vid = t.dataset.id;
    const holder = document.createElement('div'); holder.className = 'vthumb';
    holder.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${esc(vid)}?autoplay=1" title="플레이 영상" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    box.replaceWith(holder);
  }
}
document.addEventListener('change', e => {
  if (e.target.matches('[data-act="sort"]')) { S.sort = e.target.value; render(); }
});
$('#navBar').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  S.tab = b.dataset.tab; render(); window.scrollTo({ top: 0 });
});
$('#fabCall').addEventListener('click', () => { canWrite() ? callModal() : memberGate(callModal); });
$('#fabGear').addEventListener('click', adminGate);

/* ================= 시작 ================= */
DB.subscribe(render);
(async function start() {
  await DB.init();
  render();
})();
</script>
